# =============================================================================
# ~/.config/starship.toml — Starship prompt configuration
# Generated by linux-initial-script
# https://github.com/StevenWFry/linux-initial-script
# Full reference: https://starship.rs/config/
# =============================================================================

# Prompt layout — two lines:
#   Line 1:  os  dir  git branch  git status  [fill →]  langs  duration  time
#   Line 2:  ❯
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$time\
$line_break\
$character"""

# Blank line above each prompt for breathing room
add_newline = true

# How long (ms) to wait for a module before showing it as slow
command_timeout = 1000

# =============================================================================
# Left side
# =============================================================================

# -----------------------------------------------------------------------------
# OS icon  (requires Nerd Fonts)
# -----------------------------------------------------------------------------
[os]
disabled = false
style = "bold white"

[os.symbols]
Pop       = " "
Ubuntu    = " "
Debian    = " "
Fedora    = " "
Arch      = " "
Manjaro   = " "
EndeavourOS = " "
Linux     = " "
Macos     = " "
Windows   = " "

# -----------------------------------------------------------------------------
# Username — only shown when root or over SSH
# -----------------------------------------------------------------------------
[username]
show_always = false
style_user  = "bold cyan"
style_root  = "bold red"
format      = "[$user]($style) "

# -----------------------------------------------------------------------------
# Hostname — only shown over SSH
# -----------------------------------------------------------------------------
[hostname]
ssh_only = true
style    = "bold green"
format   = "[@$hostname]($style) "

# -----------------------------------------------------------------------------
# Directory
# -----------------------------------------------------------------------------
[directory]
style             = "bold blue"
read_only         = " 󰌾"
truncation_length = 4
truncate_to_repo  = true
truncation_symbol = "…/"
format            = "[$path]($style)[$read_only]($read_only_style) "

# -----------------------------------------------------------------------------
# Git branch
# -----------------------------------------------------------------------------
[git_branch]
symbol = " "
style  = "bold purple"
format = "[$symbol$branch(:$remote_branch)]($style) "

# -----------------------------------------------------------------------------
# Git status
# -----------------------------------------------------------------------------
[git_status]
style  = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"

conflicted = "󰩌 "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "? "
stashed    = " "
modified   = "! "
staged     = "+ "
renamed    = "» "
deleted    = "✘ "

# =============================================================================
# Fill — pushes right-side modules to the far right of the terminal
# =============================================================================
[fill]
symbol = " "

# =============================================================================
# Right side (language versions — only shown inside relevant projects)
# =============================================================================

# -----------------------------------------------------------------------------
# Node.js
# -----------------------------------------------------------------------------
[nodejs]
symbol       = " "
style        = "bold green"
format       = "[$symbol($version )]($style)"
detect_files = ["package.json", ".node-version", ".nvmrc"]

# -----------------------------------------------------------------------------
# Python
# -----------------------------------------------------------------------------
[python]
symbol       = " "
style        = "bold yellow"
format       = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"
detect_files = ["requirements.txt", "setup.py", "setup.cfg", "pyproject.toml", ".python-version"]

# -----------------------------------------------------------------------------
# Rust
# -----------------------------------------------------------------------------
[rust]
symbol = " "
style  = "bold red"
format = "[$symbol($version )]($style)"

# -----------------------------------------------------------------------------
# Go
# -----------------------------------------------------------------------------
[golang]
symbol = " "
style  = "bold cyan"
format = "[$symbol($version )]($style)"

# -----------------------------------------------------------------------------
# Docker context — only shown when a relevant file is present
# -----------------------------------------------------------------------------
[docker_context]
symbol        = " "
style         = "bold blue"
format        = "[$symbol$context]($style) "
only_with_files = true

# -----------------------------------------------------------------------------
# Command duration — shown when a command takes longer than 2 seconds
# -----------------------------------------------------------------------------
[cmd_duration]
min_time = 2_000
style    = "bold yellow"
format   = "[ $duration]($style) "

# -----------------------------------------------------------------------------
# Time
# -----------------------------------------------------------------------------
[time]
disabled     = false
style        = "bold dimmed white"
format       = "[ $time]($style)"
time_format  = "%H:%M"

# =============================================================================
# Prompt character — turns red on non-zero exit code
# =============================================================================
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold green)"
